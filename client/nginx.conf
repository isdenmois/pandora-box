server {
    listen $PORT;
    root /usr/share/nginx/html;
    access_log  off;

    # Proxy API requests
    location /api/ {
        proxy_pass $API_SERVER/api/;
    }

    # Stored posters: served straight from the mounted images volume. The `^~` prefix wins over
    # the extension regex below; a miss is proxied to the API, which downloads and stores it.
    location ^~ /images/ {
        # Files are named per record and overwritten when the source changes, so they must be
        # revalidated instead of being cached as immutable.
        add_header Cache-Control "public, no-cache";
        try_files $uri @images;
    }

    # `try_files` falls through to the named location without keeping the URI, so the path is
    # rebuilt from the original request here.
    location @images {
        proxy_pass $API_SERVER$request_uri;
    }

    # Serve static files, cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1w;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: serve index.html, no cache
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        try_files /index.html =404;
    }
}
