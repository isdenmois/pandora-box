services:
  api:
    build: .
    volumes:
      - ./data:/data
    environment:
      DATABASE_URL: /data/local.db
      OMDB_URL: ${OMDB_URL}
      IMAGE_DIR: /data/images
      # Offsite backup. Unset values arrive as empty strings, which the env schema reads as absent.
      FIREBASE_DB_URL: ${FIREBASE_DB_URL:-}
      FIREBASE_SERVICE_ACCOUNT_B64: ${FIREBASE_SERVICE_ACCOUNT_B64:-}
      BACKUP_TOKEN: ${BACKUP_TOKEN:-}
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "3000:3000"
    volumes:
      # Only the images are shared; nginx serves hits directly and proxies misses to the API.
      - ./data/images:/usr/share/nginx/html/images:ro
    depends_on:
      - api
    environment:
      API_SERVER: http://api:3000
      PORT: 3000
