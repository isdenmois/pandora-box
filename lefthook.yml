pre-commit:
  jobs:
    - name: check
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx,vue,html,css,json,jsonc}"
      run: biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    # Server-only for now: there is no vue-tsc, and `tsc` cannot read `.vue` files.
    - name: typecheck
      glob: "server/**/*.ts"
      run: npm run typecheck

pre-push:
  parallel: true
  jobs:
    - name: test:server
      run: npm run test:server
    - name: test:client
      run: npm run test:client
    - name: test:pw
      run: npm run test:pw
